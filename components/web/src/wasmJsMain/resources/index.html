<!doctype html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="dark">
    <title>Baby Phone</title>
    <style>
        html, body { margin: 0; height: 100%; background: #10131a; overflow: hidden; }
        .scanner { position: fixed; inset: 0; z-index: 10; background: rgba(0, 0, 0, .9);
                   display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 24px; }
        .scanner video { max-width: min(90vw, 640px); max-height: 70vh; border-radius: 16px; }
        .scanner button { font: 16px system-ui, sans-serif; color: #e8eaf0; background: #1a1f2b;
                          border: 1px solid #3a3f4b; border-radius: 24px; padding: 12px 32px; cursor: pointer; }
    </style>
    <script type="application/javascript" src="babyphone.js"></script>
</head>
<body></body>
</html>
