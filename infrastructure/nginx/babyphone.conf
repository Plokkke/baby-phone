# Host nginx on the Raspberry Pi → server container (Terraform var host_port).
# Adapt the certificate paths to your existing setup.
server {
    listen 443 ssl;
    http2 on;
    server_name babyphone.crn-tech.fr;

    ssl_certificate     /etc/letsencrypt/live/babyphone.crn-tech.fr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/babyphone.crn-tech.fr/privkey.pem;

    location /ws/ {
        proxy_pass http://127.0.0.1:18080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        proxy_buffering off;
        # Room ids are in the URL; nothing sensitive, but no need to keep them.
        access_log off;
    }

    location / {
        proxy_pass http://127.0.0.1:18080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
