services:
  server:
    build:
      context: ..
      dockerfile: infrastructure/Dockerfile
    environment:
      ANDROID_PACKAGE: ${ANDROID_PACKAGE:-fr.crntech.babyphone}
      ANDROID_CERT_SHA256: ${ANDROID_CERT_SHA256:?Set the app signing certificate SHA-256 in infrastructure/.env}
    restart: unless-stopped

  # TLS termination with automatic Let's Encrypt certificates; WebSockets are proxied transparently.
  caddy:
    image: caddy:2
    ports:
      - "80:80"
      - "443:443"
    environment:
      PUBLIC_HOST: ${PUBLIC_HOST:?Set PUBLIC_HOST in infrastructure/.env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on:
      - server
    restart: unless-stopped

volumes:
  caddy_data:
